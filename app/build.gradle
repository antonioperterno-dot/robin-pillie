plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketsoccer'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.pocketsoccer'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
